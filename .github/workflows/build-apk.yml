name: Build GEN-Z

on:
  push:
    branches: [main]
    paths-ignore: ['windows/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # to get a Play-ready signed .aab. Without them the .aab is built unsigned.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GENZ_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK and release bundle
        env:
          GENZ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GENZ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GENZ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug bundleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GEN-Z-Music
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab

      # Publishes the build log, APK and AAB to the "ci-output" branch so they can be fetched with plain git.
      - name: Publish to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          cp app/build/outputs/apk/debug/*.apk /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab /tmp/out/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rfq .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -qm "CI output for ${GITHUB_SHA}"
          git push -f origin ci-output
