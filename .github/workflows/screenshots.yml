name: Screenshots

# Runs the debug app on an Android emulator with royalty-free demo music and captures screenshots
# of every screen, theme and cover effect. Results are pushed to the "screenshots" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk .

      - name: Make demo music
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install --quiet pillow
          python3 scripts/make_demo_music.py demo
          ls demo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: bash scripts/shots.sh

      - name: Publish screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r shots/. /tmp/out/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq .
          git clean -fdxq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}" || echo "nothing captured"
          git push -f origin screenshots
